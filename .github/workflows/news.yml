name: Telegram News Automation Bot

on:
  schedule:
    # 30분마다 실행
    - cron: '*/30 * * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 한글 폰트 및 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install -r requirements.txt

      - name: 파이썬 봇 실행 (시각 판별)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)

          # KST 08:00, 13:00, 19:00 (UTC 기준 23:00, 04:00, 10:00) 정각에는 종합 브리핑 실행
          if [ "$MINUTE" -le "5" ] && ( [ "$HOUR" -eq "23" ] || [ "$HOUR" -eq "4" ] || [ "$HOUR" -eq "10" ] ); then
            python news_bot.py --mode brief
          else
            python news_bot.py --mode keyword
          fi

      - name: 중복 기록(history.json) 저장 커밋
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add history.json
          git commit -m "Update news history [skip ci]" || exit 0
          git push
