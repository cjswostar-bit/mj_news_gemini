
name: Telegram News Automation Bot

on:
  schedule:
    # 30분마다 농협 관련 뉴스 확인
    - cron: '*/30 * * * *'

    # 한국시간 08:07, 13:07, 19:07
    - cron: '7 23,4,10 * * *'

  # 수동 실행 버튼
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 뉴스 종류'
        required: true
        default: 'keyword'
        type: choice
        options:
          - keyword
          - brief

# 이력 저장 권한
permissions:
  contents: write

# 동시 실행 방지
concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # GitHub 저장소 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python 설치
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 한글 폰트 및 패키지 설치
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 뉴스 봇 실행
      - name: Run News Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MANUAL_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$MANUAL_MODE"
          elif [ "$SCHEDULE" = "7 23,4,10 * * *" ]; then
            MODE="brief"
          else
            MODE="keyword"
          fi

          echo "Running mode: $MODE"
          python news_bot.py --mode "$MODE"

      # 발송 이력 저장
      - name: Save news history
        if: always()
        run: |
          if [ -f history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add history.json

            if ! git diff --cached --quiet; then
              git commit -m "Update news history [skip ci]"
              git pull --rebase
              git push
            else
              echo "No history changes"
            fi
          fi
